# fly.toml app configuration file for GOKU Discord Bot on Fly.io
# Background worker process with persistent SQLite volume (no public HTTP listeners)

app = "goku-discord-bot"
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/goku.sqlite"

[mounts]
  source = "goku_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  auto_stop_machines = false
  auto_start_machines = false
